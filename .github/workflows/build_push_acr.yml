name: Docker Image Deployment to ACR

on:
  push:
    branches: [ "main" ]
    #tags: ['v*']
  pull_request:
    branches: [ "main" ] # Only run when PR targets main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Convert repository string to lowercase
        id: repo-name
        uses: vishalmamidi/lowercase-action@v1
        with:
          string: ${{ github.repository }}

      - name: Generate Ymd.N version tag
        id: calver
        run: |
          echo "tag=$(date -u +'%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_ENDPOINT }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.ACR_ENDPOINT }}/${{ steps.repo-name.outputs.lowercase }}:latest
            ${{ secrets.ACR_ENDPOINT }}/${{ steps.repo-name.outputs.lowercase }}:${{ steps.calver.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: create_release
        uses: ncipollo/release-action@v1.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.calver.outputs.tag }}
          name: Release ${{ steps.calver.outputs.tag }}
          generateReleaseNotes: true
          draft: false
          skipIfReleaseExists: true
