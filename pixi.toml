[workspace]
name = "undp-impact-evaluation"
version = "0.1.0"
description = "UNDP Early Recovery & Impact Evaluation Dashboard"
authors = ["UNDP"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]


# Native C/C++ engine and core numeric/geospatial libraries
[dependencies]
python = ">=3.12"
gdal = ">=3.8.0"
geos = "*"
proj = "*"
shapely = ">=2.0.0"
rasterio = "*"
pyproj = "*"
fiona = "*"
geopandas = ">=1.0.0"
numpy = ">=1.26.0"
pandas = ">=2.0.0"
make = ">=4.4.1,<5"

# Pure Python, UI, and external API packages from PyPI
[pypi-dependencies]
streamlit = ">=1.35.0"
streamlit-folium = "*"
folium = "*"
earthengine-api = "*"
python-dotenv = "*"
requests = "*"
dotenv-cli="*"
pyyaml="*"

[tasks]
# For local dev: Pixi automatically loads variables from .env
server = {cmd = "dotenv -e env streamlit run app.py" }

# For Docker / production: Relies on container-level env vars
start = "streamlit run app.py"
