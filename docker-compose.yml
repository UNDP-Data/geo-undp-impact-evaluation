services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: undp-impact-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Absolute path ensures pipeline finds the key regardless of cwd
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gee_service_account.json
    volumes:
      # 1. Credentials
      - ./gee_service_account.json:/app/gee_service_account.json:ro

      # 2. Live Code & Configs (so your local edits sync instantly)
      - ./pipeline:/app/pipeline
      - ./run_pipeline.py:/app/run_pipeline.py
      - ./app.py:/app/app.py
      - ./config:/app/config

      # 3. Data & Outputs
      - ./data:/app/data
      - ./outputs:/app/outputs

      # 4. Persistent User Workspaces (Docker named volume)
      - undp_workspaces:/root/.undp_dashboard

volumes:
  undp_workspaces: